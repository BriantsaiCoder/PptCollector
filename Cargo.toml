[package]
name = "ppt-collector"
version = "0.2.2"
edition = "2024"
publish = false
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["custom-protocol"] }
tauri-plugin-dialog = "2.8.4"
tempfile = "3.27.0"
