[package]
name = "ppt-collector"
version = "0.2.3"
edition = "2024"
publish = false
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
semver = "1.0.28"
tauri = { version = "2.12.5", features = ["custom-protocol"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-updater = "=2.14.1"
tempfile = "3.27.0"

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }

[target.'cfg(windows)'.dependencies]
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }
